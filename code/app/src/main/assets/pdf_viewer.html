<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>PDF Viewer</title>
    <style>
        body {
            margin: 0;
            background-color: #333;
            font-family: sans-serif;
            color: #fff;
        }

        #viewer-container {
            width: 100%;
            overflow: auto;
            padding-bottom: 70px;
        }

        #page-wrapper {
            transform-origin: top center;
            transition: transform 0.15s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: max-content;
        }

        .page-container {
            position: relative;
            margin: 10px 0;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-container canvas {
            display: block;
        }

        .page-placeholder {
            color: #888;
            font-size: 14px;
            user-select: none;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        #zoom-controls {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 18px;
            padding: 4px 12px;
            z-index: 100;
        }

        #zoom-controls button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #zoom-controls button:active {
            background: rgba(255, 255, 255, 0.4);
        }

        #zoom-label {
            font-size: 12px;
            min-width: 40px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="loading">Loading PDF...</div>
    <div id="viewer-container">
        <div id="page-wrapper"></div>
    </div>
    <div id="zoom-controls">
        <button id="btn-zoom-out">−</button>
        <span id="zoom-label">100%</span>
        <button id="btn-zoom-in">+</button>
    </div>

    <script type="module">
        import * as pdfjsLib from './pdf.mjs';

        const url = new URLSearchParams(window.location.search).get('file');
        if (!url) {
            document.getElementById('loading').innerText = 'No PDF file specified.';
        } else {
            pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';

            // get elements
            const wrapper = document.getElementById('page-wrapper');
            const loading = document.getElementById('loading');
            const zoomControls = document.getElementById('zoom-controls');
            const zoomLabel = document.getElementById('zoom-label');

            // set states
            const BASE_SCALE = 1.5;
            const INITIAL_ZOOM = 0.4;
            let cssZoom = INITIAL_ZOOM;
            let pdfDoc = null;
            let firstPageReady = false;
            const pageStates = {}; // pageNum -> { container, rendered, rendering, renderTask, canvas }

            // zoom by css transform
            function applyZoom() {
                wrapper.style.transform = `scale(${cssZoom})`;
                wrapper.style.marginBottom = `${-(wrapper.scrollHeight * (1 - cssZoom))}px`;
                zoomLabel.innerText = `${Math.round(cssZoom / INITIAL_ZOOM * 100)}%`;

                // allign to center
                const container = document.getElementById('viewer-container');
                setTimeout(() => {
                    if (container && container.scrollWidth > window.innerWidth) {
                        container.scrollLeft = (container.scrollWidth - window.innerWidth) / 2;
                    } else if (container) {
                        container.scrollLeft = 0;
                    }
                }, 0);
            }

            // load pdf
            const loadingTask = pdfjsLib.getDocument({ url: url });
            loadingTask.onProgress = (p) => {
                loading.innerText = p.total > 0
                    ? `Downloading... ${Math.round(p.loaded / p.total * 100)}%`
                    : `Downloading... ${(p.loaded / 1048576).toFixed(1)} MB`;
            };

            // observer to render/unload pages based on visibility
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const pageNum = parseInt(entry.target.dataset.pageNumber, 10);
                    if (entry.isIntersecting) renderPage(pageNum);
                    else unloadPage(pageNum);
                });
            }, { rootMargin: '150% 0px' });

            // render page
            function renderPage(pageNum) {
                const s = pageStates[pageNum];
                if (!s || s.rendered || s.rendering || !pdfDoc) return;
                s.rendering = true;

                pdfDoc.getPage(pageNum).then(page => {
                    // set container size
                    if (!s.rendering) { page.cleanup(); return; }
                    const vp = page.getViewport({ scale: BASE_SCALE });
                    s.container.style.width = `${vp.width}px`;
                    s.container.style.height = `${vp.height}px`;

                    // create canvas with High-DPI scaling
                    const dpr = window.devicePixelRatio || 1;
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(vp.width * dpr);
                    canvas.height = Math.floor(vp.height * dpr);
                    canvas.style.width = `${vp.width}px`;
                    canvas.style.height = `${vp.height}px`;
                    s.container.innerHTML = '';
                    s.container.appendChild(canvas);
                    s.canvas = canvas;

                    const ctx = canvas.getContext('2d', { alpha: false });
                    ctx.scale(dpr, dpr);

                    // render page
                    s.renderTask = page.render({
                        canvasContext: ctx,
                        viewport: vp
                    });

                    // cleanup callbacks
                    s.renderTask.promise.then(() => {
                        s.rendering = false;
                        s.rendered = true;
                        s.renderTask = null;
                        page.cleanup();

                        if (!firstPageReady) {
                            firstPageReady = true;
                            loading.style.display = 'none';
                            zoomControls.style.display = 'flex';
                            applyZoom();
                        }
                    }).catch(err => {
                        s.rendering = false;
                        s.renderTask = null;
                        if (err?.name !== 'RenderingCancelledException') {
                            console.error(`Render error p${pageNum}:`, err);
                        }
                    });
                }).catch(err => {
                    s.rendering = false;
                    console.error(`getPage error p${pageNum}:`, err);
                });
            }

            // unload page
            function unloadPage(pageNum) {
                const s = pageStates[pageNum];
                if (!s) return;

                if (s.renderTask) {
                    s.renderTask.cancel();
                    s.renderTask = null;
                }
                s.rendering = false;

                if (s.canvas) {
                    s.canvas.width = 0;
                    s.canvas.height = 0;
                    s.canvas.remove();
                    s.canvas = null;
                }
                s.rendered = false;

                if (s.container && !s.container.hasChildNodes()) {
                    const ph = document.createElement('div');
                    ph.className = 'page-placeholder';
                    ph.innerText = `Page ${pageNum}`;
                    s.container.appendChild(ph);
                }
            }

            // start loading
            loadingTask.promise.then(pdf => {
                pdfDoc = pdf;
                loading.innerText = 'Initializing pages...';

                pdf.getPage(1).then(p1 => {
                    const vp = p1.getViewport({ scale: BASE_SCALE });
                    const defW = `${vp.width}px`;
                    const defH = `${vp.height}px`;
                    p1.cleanup();

                    // insert page containers
                    const frag = document.createDocumentFragment();
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const c = document.createElement('div');
                        c.className = 'page-container';
                        c.style.width = defW;
                        c.style.height = defH;
                        c.dataset.pageNumber = i;

                        const ph = document.createElement('div');
                        ph.className = 'page-placeholder';
                        ph.innerText = `Page ${i}`;
                        c.appendChild(ph);

                        frag.appendChild(c);
                        pageStates[i] = { container: c, rendered: false, rendering: false, renderTask: null, canvas: null };
                        observer.observe(c);
                    }
                    wrapper.appendChild(frag);

                    setTimeout(() => { if (!firstPageReady) renderPage(1); }, 100);
                }).catch(err => {
                    loading.innerText = `Error reading page 1: ${err.message}`;
                });
            }).catch(err => {
                loading.innerText = `Error loading PDF: ${err.message}`;
            });

            // zoom controls
            const MIN_ZOOM = INITIAL_ZOOM * 0.5; // 50%
            const MAX_ZOOM = INITIAL_ZOOM * 2.0; // 200%
            const ZOOM_STEP = INITIAL_ZOOM * 0.1; // 10% step

            document.getElementById('btn-zoom-in').onclick = () => {
                if (cssZoom < MAX_ZOOM - 0.005) {
                    cssZoom = Math.min(MAX_ZOOM, cssZoom + ZOOM_STEP);
                    applyZoom();
                }
            };
            document.getElementById('btn-zoom-out').onclick = () => {
                if (cssZoom > MIN_ZOOM + 0.005) {
                    cssZoom = Math.max(MIN_ZOOM, cssZoom - ZOOM_STEP);
                    applyZoom();
                }
            };

            // cleanup on unload
            window.addEventListener('unload', () => {
                observer.disconnect();
                pdfDoc?.destroy();
            });
        }
    </script>
</body>

</html>
